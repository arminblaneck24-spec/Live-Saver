name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projekt entpacken
        run: for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done; true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts -path '*LifeSave*' | head -1)")
          cd "$DIR" && gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LifeSave-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
